name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # checkout leaves the pushed tag without its annotation, and the release
      # title is read from it.
      - run: git fetch --force --tags origin

      - uses: actions/checkout@v4
        with:
          repository: mariaalexissales/estral-tools
          ssh-key: ${{ secrets.ESTRAL_TOOLS_KEY }}
          path: estral-tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: publish the notes and the workshop zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: python estral-tools/bundle-up/publish_release.py "$GITHUB_REF_NAME"
