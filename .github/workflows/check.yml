name: checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-files:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # the generators live in estral-tools, which is private, so this needs the
      # read-only deploy key. it lands beside the mod rather than in it, and they
      # read the mod out of the working directory, not their own location.
      - uses: actions/checkout@v4
        with:
          repository: mariaalexissales/estral-tools
          ssh-key: ${{ secrets.ESTRAL_TOOLS_KEY }}
          path: estral-tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # the generators are stdlib-only, so there is nothing to install.
      # --check exits 1 and names the stale files if regenerating would change them.
      - name: tiers are up to date
        run: python estral-tools/bundle-up/generate_tiers.py --check

      # page assignment is derived from the weight data, so a new tier batch
      # would otherwise land its sliders on the wrong sandbox page in silence.
      - name: sandbox options are up to date
        run: python estral-tools/bundle-up/generate_sandbox.py --check

      # dedicated servers read the script Weight, not the client lua, so a stale
      # one is the wrong weight for everyone on a server.
      - name: script weights are up to date
        run: python estral-tools/bundle-up/sync_weights.py --check

  mod-files:
    name: mod files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: mariaalexissales/estral-tools
          ssh-key: ${{ secrets.ESTRAL_TOOLS_KEY }}
          path: estral-tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # broken json and a missing name both fail silently in game: the label
      # just renders as its raw key.
      - name: every item, recipe and label has a name
        run: python estral-tools/bundle-up/check_translations.py

      - name: scripts only point at things that exist
        run: python estral-tools/bundle-up/check_scripts.py

      # a lua syntax error only shows up once the game loads the file.
      - name: lua files parse
        run: |
          pip install --quiet luaparser==4.2.0
          python estral-tools/bundle-up/check_lua.py

      - name: no file mixes line endings
        run: python estral-tools/bundle-up/check_line_endings.py
