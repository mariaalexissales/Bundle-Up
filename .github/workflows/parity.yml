name: workshop parity

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/parity.yml']

permissions:
  contents: read

jobs:
  parity:
    name: main matches the live workshop build
    runs-on: ubuntu-latest
    steps:
      # always main, even on a pull request: main is the branch that has to match.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: download the workshop build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
          # steamcmd exits non-zero after updating itself, so judge it by what it downloaded.
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +force_install_dir "$RUNNER_TEMP/workshop" +login anonymous \
            +workshop_download_item 108600 3746632343 validate +quit || true
          test -d "$RUNNER_TEMP/workshop/steamapps/workshop/content/108600/3746632343/mods"

      - name: no file differs
        run: diff -rq "$RUNNER_TEMP/workshop/steamapps/workshop/content/108600/3746632343/mods" Contents/mods
